# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:  # yamllint disable-line rule:truthy
  - pull_request

env:
  TESTOPTS: --verbose

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - '2.7'
          - '3.0'
          - ruby-head
          - jruby-head
        appraisal:
          - rails-6.0
          - rails-6.0-activesupport
          - rails-6.1
          - rails-6.1-activesupport
    services:
      postgres:
        image: postgres:12.1
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_DB: scoped_search_test
      mariadb:
        image: mariadb:10
        ports: ['3306:3306']
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: scoped_search_test

    env:
      BUNDLE_GEMFILE: appraisal.gemfile

    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby ${{ matrix.ruby_version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
      - name: Generate gemfiles
        run: bundle exec appraisal generate
      - name: Appraisal for ${{ matrix.ruby_version }} ${{ matrix.appraisal }}
        run: bundle exec appraisal ${{ matrix.appraisal }} bundle
      - name: Tests for ${{ matrix.ruby_version }} ${{ matrix.appraisal }}
        run: bundle exec appraisal ${{ matrix.appraisal }} bundle exec rake
